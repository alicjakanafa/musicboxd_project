# Profile used exclusively by @DataJpaTest repository tests.
# Runs against an in-memory H2 database instead of the Postgres/Flyway-managed
# datasource used by the application (application.properties / application-test.properties).
# This file only takes effect for tests that explicitly activate the
# "datajpatest" profile, so it does not affect MusicBoxdApplicationTests or any
# other test that relies on the default/prod Postgres configuration.

spring.datasource.url=jdbc:h2:mem:musicboxd-datajpatest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# @DataJpaTest only needs the JPA/repository slice of the context, but Okta's
# OktaOAuth2PropertiesMappingEnvironmentPostProcessor eagerly performs a live
# HTTP OIDC discovery call against okta.oauth2.issuer during environment
# preparation, before Spring even decides which auto-configuration to apply.
# Pointing the issuer at a local port that nothing listens on makes that call
# fail fast with a connection error (which the post-processor catches and
# falls back on), instead of depending on a real Auth0/Okta tenant or network
# access, so these tests stay isolated, deterministic, and independent of
# Auth0/Okta configuration or connectivity.
okta.oauth2.issuer=http://127.0.0.1:1/
okta.oauth2.client-id=test-client-id
okta.oauth2.client-secret=test-client-secret