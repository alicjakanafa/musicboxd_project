# Profile used exclusively by @DataJpaTest repository tests.
# Runs against an in-memory H2 database instead of the Postgres/Flyway-managed
# datasource used by the application (application.properties / application-test.properties).
# This file only takes effect for tests that explicitly activate the
# "datajpatest" profile, so it does not affect MusicBoxdApplicationTests or any
# other test that relies on the default/prod Postgres configuration.

spring.datasource.url=jdbc:h2:mem:musicboxd-datajpatest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect