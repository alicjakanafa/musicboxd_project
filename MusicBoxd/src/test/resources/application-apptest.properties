# Profile for full-context tests (@SpringBootTest) such as MusicBoxdApplicationTests.
# Uses an in-memory H2 database and dummy credentials so the application context
# can start without a local Postgres instance or real API/Auth0 secrets.

spring.datasource.url=jdbc:h2:mem:musicboxd-apptest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

lastfm.api.key=test-lastfm-key
spotify.client.id=test-spotify-client-id
spotify.client.secret=test-spotify-client-secret
spotify.redirect.uri=http://localhost/spotify/callback
ticketmaster.api.key=test-ticketmaster-key
ticketmaster.api.base-url=http://localhost/ticketmaster

okta.oauth2.issuer=https://test.example.com/
okta.oauth2.client-id=test-client-id
okta.oauth2.client-secret=test-client-secret

logging.level.org.springframework.security=INFO
