<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MusicBoxd - Top 40</title>

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
          rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin
  >

  <link
          href="https://fonts.googleapis.com/css2?family=Audiowide&family=DM+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"
  >

  <link rel="stylesheet" th:href="@{/css/top40.css}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<div class="page">

  <header th:replace="~{fragments/navbar :: navbar}"></header>


  <main class="container">

    <section class="hero">

      <div class="hero-label">
        LAST.FM GLOBAL CHART
      </div>

      <h1>
        Top <span>40</span>
      </h1>

      <p>
        The artists the world is listening to right now.
      </p>

    </section>


    <section class="chart-header">

      <div>

        <h2>
          Trending Artists
        </h2>

        <p>
          Ranked by listeners worldwide
        </p>

      </div>

      <div class="chart-source">
        Powered by <strong>Last.fm</strong>
      </div>

    </section>


    <div class="artist-list">

      <div
              class="artist-card"
              th:each="artist, stat : ${artists}"
              th:classappend="${stat.count <= 3} ? 'top-three' : ''"
      >

        <div
                class="rank"
                th:text="${stat.count}"
        >
          1
        </div>


        <div class="artist-info">

          <h3 class="artist-name">

            <a
                    th:href="@{/artists/from-name(name=${artist.name})}"
                    th:text="${artist.name}"
            >
              Artist Name
            </a>

          </h3>


          <div class="artist-stats">

            <p th:if="${artist.listeners != null}">

                            <span
                                    th:text="${#numbers.formatInteger(artist.listeners, 3, 'COMMA')}"
                            >
                                0
                            </span>

              listeners

            </p>


            <span class="stat-divider">
                            •
                        </span>


            <p th:if="${artist.playcount != null}">

                            <span
                                    th:text="${#numbers.formatInteger(artist.playcount, 3, 'COMMA')}"
                            >
                                0
                            </span>

              plays

            </p>

          </div>

        </div>


        <a
                class="artist-link"
                th:href="${artist.url}"
                target="_blank"
                rel="noopener noreferrer"
        >

                    <span>
                        Last.fm
                    </span>

          <span class="arrow">
                        ↗
                    </span>

        </a>

      </div>

    </div>


    <div
            class="empty-state"
            th:if="${artists == null or artists.isEmpty()}"
    >

      <div class="empty-icon">
        ♪
      </div>

      <h2>
        No artists found
      </h2>

      <p>
        The Last.fm chart is currently unavailable.
      </p>

    </div>

  </main>


  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>

</body>

</html>
