<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MusicBoxd - Search Songs</title>

    <link rel="stylesheet" th:href="@{/css/search.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<div class="page">

    <!-- Shared MusicBoxd navbar -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>


    <main class="container">

        <section class="hero">

            <div class="hero-label">
                MUSICBOXD SEARCH
            </div>

            <h1>
                Find <span>Songs</span>
            </h1>

            <p>
                Search for songs and discover music to listen to and review.
            </p>

        </section>


        <form
                action="/search/tracks"
                method="get"
                class="search-form"
        >

            <input
                    type="text"
                    name="query"
                    th:value="${query}"
                    placeholder="Search for a song or artist..."
                    required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <section
                class="results-header"
                th:if="${tracks != null and !tracks.isEmpty()}"
        >

            <div>

                <h2>
                    Search Results
                </h2>

                <p>
                    Songs matching your search
                </p>

            </div>

        </section>


        <div
                class="results"
                th:if="${tracks != null and !tracks.isEmpty()}"
        >

            <div
                    class="album-card"
                    th:each="track : ${tracks}"
            >

                <!-- HD artwork -->
                <img
                        th:if="${track.highResolutionArtworkUrl != null}"
                        th:src="${track.highResolutionArtworkUrl}"
                        th:alt="${track.trackName}"
                >


                <h2 th:text="${track.trackName}">
                    Song Name
                </h2>


                <p th:text="${track.artistName}">
                    Artist Name
                </p>


                <p
                        th:if="${track.collectionName != null}"
                        th:text="${track.collectionName}"
                >
                    Album Name
                </p>


                <div
                        th:if="${track.previewUrl != null}"
                        class="song-preview"
                >

                    <audio controls>

                        <source
                                th:src="${track.previewUrl}"
                                type="audio/mpeg"
                        >

                        Your browser does not support the audio element.

                    </audio>

                </div>

            </div>

        </div>


        <div
                class="empty-state"
                th:if="${tracks != null and tracks.isEmpty()}"
        >

            <div class="empty-icon">
                ♪
            </div>

            <h2>
                No songs found
            </h2>

            <p>
                Try searching for a different song or artist.
            </p>

        </div>

    </main>


    <!-- Shared MusicBoxd footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>

</body>

</html>
