<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MusicBoxd - Search Songs</title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Audiowide&family=DM+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
    >


    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/search.css}">

    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">

</head>


<body>

<div class="page">


    <!-- NAVBAR -->

    <header th:replace="~{fragments/navbar :: navbar}"></header>


    <!-- MAIN CONTENT -->

    <main class="container">


        <!-- HERO -->

        <section class="hero">

            <div class="hero-label">
                MUSICBOXD SEARCH
            </div>

            <h1>
                Find <span>Songs</span>
            </h1>

            <p>
                Search for songs and discover music to listen to and review.
            </p>

        </section>


        <!-- SEARCH FORM -->

        <form
                action="/search/tracks"
                method="get"
                class="search-form"
        >

            <input
                    type="text"
                    name="query"
                    th:value="${query}"
                    placeholder="Search for a song or artist..."
                    required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <!-- RESULTS HEADER -->

        <section
                class="results-header"
                th:if="${tracks != null and !tracks.isEmpty()}"
        >

            <div>

                <h2>
                    Search Results
                </h2>

                <p>
                    Songs matching your search
                </p>

            </div>

        </section>


        <!-- RESULTS -->

        <div
                class="results"
                th:if="${tracks != null and !tracks.isEmpty()}"
        >


            <!-- TRACK CARD -->

            <div
                    class="track-card"
                    th:each="track : ${tracks}"
            >


                <!-- ALBUM ARTWORK -->

                <img
                        th:if="${track.highResolutionArtworkUrl != null}"
                        th:src="${track.highResolutionArtworkUrl}"
                        th:alt="${track.trackName}"
                >


                <!-- SONG TITLE -->

                <h2
                        th:text="${track.trackName}"
                >
                    Song Name
                </h2>


                <!-- ARTIST -->

                <p
                        th:text="${track.artistName}"
                >
                    Artist Name
                </p>


                <!-- ALBUM -->

                <p
                        th:if="${track.collectionName != null}"
                        th:text="${track.collectionName}"
                >
                    Album Name
                </p>


                <!-- AUDIO PREVIEW -->

                <div
                        th:if="${track.previewUrl != null}"
                        class="song-preview"
                >

                    <audio controls>

                        <source
                                th:src="${track.previewUrl}"
                                type="audio/mpeg"
                        >

                        Your browser does not support the audio element.

                    </audio>

                </div>


            </div>

        </div>


        <!-- EMPTY STATE -->

        <div
                class="empty-state"
                th:if="${tracks != null and tracks.isEmpty()}"
        >

            <div class="empty-icon">
                ♪
            </div>

            <h2>
                No songs found
            </h2>

            <p>
                Try searching for a different song or artist.
            </p>

        </div>


    </main>


    <!-- FOOTER -->

    <footer
            th:replace="~{fragments/footer :: footer}"
    ></footer>


</div>

</body>

</html>
