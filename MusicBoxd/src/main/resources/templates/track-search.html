<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Song Search - MusicBoxd</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-form input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        .search-form button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .track-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .track-card img {
            width: 100%;
            border-radius: 8px;
        }

        .track-card h2 {
            margin-bottom: 5px;
        }

        .track-card p {
            margin-top: 5px;
            color: #666;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="search-container">

    <h1>Search Songs</h1>

    <form
            action="/search/tracks"
            method="get"
            class="search-form"
    >
        <input
                type="text"
                name="query"
                th:value="${query}"
                placeholder="Search for a song or artist..."
                required
        >

        <button type="submit">
            Search
        </button>
    </form>

    <div class="results">

        <div
                class="track-card"
                th:each="track : ${tracks}"
        >

            <img
                    th:if="${track.artworkUrl100 != null}"
                    th:src="${track.artworkUrl100}"
                    th:alt="${track.trackName}"
            >

            <h2 th:text="${track.trackName}">
                Song Title
            </h2>

            <p th:text="${track.artistName}">
                Artist Name
            </p>

            <p th:text="${track.collectionName}">
                Album Name
            </p>

            <audio
                    th:if="${track.previewUrl != null}"
                    controls
            >
                <source
                        th:src="${track.previewUrl}"
                        type="audio/mpeg"
                >
            </audio>

            <p th:if="${track.previewUrl == null}">
                No preview available.
            </p>

        </div>

    </div>

</div>

</body>

</html>
