<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${artist.name} + ' - MusicBoxd'">
        Artist - MusicBoxd
    </title>

    <link
            rel="stylesheet"
            th:href="@{/css/artist-profile.css}"
    >

</head>

<body>

<div class="artist-page">


    <!-- =========================
         ARTIST HEADER
         ========================= -->

    <header class="artist-header">

        <div class="artist-information">

            <p class="artist-label">
                ARTIST
            </p>

            <h1 th:text="${artist.name}">
                Artist Name
            </h1>

            <p
                    class="artist-listeners"
                    th:if="${artistInfo != null}"
            >

                <span
                        th:text="${artistInfo.listeners}"
                >
                    0
                </span>


            </p>

        </div>

    </header>


    <!-- =========================
         ALBUMS
         ========================= -->

    <main>

        <section class="albums-section">

            <div class="section-header">

                <h2>
                    Albums
                </h2>

                <span
                        th:text="${#lists.size(albums)} + ' albums'"
                >
                    0 albums
                </span>

            </div>


            <div class="album-grid">

                <!--
                    Each album comes from Last.fm.

                    Clicking an album sends its artist name
                    and album name to our controller.
                -->

                <a
                        class="album-card"
                        th:each="album : ${albums}"
                        th:href="@{/album/from-artist(
                            artistName=${artist.name},
                            albumName=${album.name}
                        )}"
                >

                    <!-- Album artwork -->

                    <div class="album-art">

                        <img
                                th:if="${album.image != null and !album.image.isEmpty()}"
                                th:src="${album.image.get(album.image.size() - 1).text}"
                                th:alt="${album.name}"
                        >

                        <div
                                class="album-art-placeholder"
                                th:if="${album.image == null or album.image.isEmpty()}"
                        >
                            No artwork
                        </div>

                    </div>


                    <!-- Album information -->

                    <div class="album-information">

                        <h3
                                th:text="${album.name}"
                        >
                            Album Name
                        </h3>


                    </div>

                </a>

            </div>


            <!-- =========================
                 NO ALBUMS
                 ========================= -->

            <div
                    class="empty-message"
                    th:if="${#lists.isEmpty(albums)}"
            >

                <p>
                    No albums found for this artist.
                </p>

            </div>

        </section>

    </main>

</div>

</body>

</html>
