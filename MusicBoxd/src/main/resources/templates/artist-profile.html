<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title th:text="${artist.name} + ' - MusicBoxd'">
        Artist - MusicBoxd
    </title>

    <link rel="stylesheet" th:href="@{/css/artist-profile.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<div class="artist-page">

    <header th:replace="~{fragments/navbar :: navbar}"></header>


    <!-- Artist information -->

    <header class="artist-header">

        <div class="artist-information">

            <p class="artist-label">
                ARTIST
            </p>

            <h1 th:text="${artist.name}">
                Artist Name
            </h1>

            <p
                    class="artist-listeners"
                    th:if="${artistInfo != null}"
            >
                <span th:text="${artistInfo.listeners}">
                    0
                </span>
                listeners
            </p>

            <!-- Scroll to events button -->

            <button
                    class="events-button"
                    onclick="scrollToEvents()"
                    th:if="${!#lists.isEmpty(concerts)}"
            >
                Upcoming Events ↓
            </button>

        </div>

    </header>


    <main>


        <!-- ALBUMS -->

        <section class="albums-section">

            <div class="section-header">

                <div>
                    <p class="section-label">
                        DISCOGRAPHY
                    </p>

                    <h2>
                        Albums
                    </h2>
                </div>

                <div class="album-header-right">

                    <span
                            class="album-count"
                            th:text="${#lists.size(albums)} + ' albums'"
                    >
                        0 albums
                    </span>

                    <a
                            class="view-all-button"
                            th:href="@{/artist/{id}/albums(
                                id=${artist.id}
                            )}"
                    >
                        View all →
                    </a>

                </div>

            </div>


            <!-- Horizontal album carousel -->

            <div class="album-carousel-wrapper">

                <button
                        class="carousel-button carousel-left"
                        onclick="scrollAlbums(-1)"
                        aria-label="Previous albums"
                >
                    ‹
                </button>


                <div
                        class="album-carousel"
                        id="albumCarousel"
                >

                    <a
                            class="album-card"
                            th:each="album : ${albums}"
                            th:href="@{/album/from-artist(
                                artistName=${artist.name},
                                albumName=${album.name}
                            )}"
                    >

                        <div class="album-art">

                            <img
                                    th:if="${album.image != null and !album.image.isEmpty()}"
                                    th:src="${album.image.get(album.image.size() - 1).text}"
                                    th:alt="${album.name}"
                            >

                            <div
                                    class="album-art-placeholder"
                                    th:if="${album.image == null or album.image.isEmpty()}"
                            >
                                No artwork
                            </div>

                        </div>


                        <div class="album-information">

                            <h3 th:text="${album.name}">
                                Album Name
                            </h3>

                        </div>

                    </a>

                </div>


                <button
                        class="carousel-button carousel-right"
                        onclick="scrollAlbums(1)"
                        aria-label="Next albums"
                >
                    ›
                </button>

            </div>


            <div
                    class="empty-message"
                    th:if="${#lists.isEmpty(albums)}"
            >

                <p>
                    No albums found for this artist.
                </p>

            </div>

        </section>



        <!-- UPCOMING EVENTS -->

        <section
                class="albums-section events-section"
                id="upcoming-events"
        >

            <div class="section-header">

                <div>

                    <p class="section-label">
                        LIVE MUSIC
                    </p>

                    <h2>
                        Upcoming Events
                    </h2>

                </div>

                <span
                        class="album-count"
                        th:text="${#lists.size(concerts)} + ' events'"
                >
                    0 events
                </span>

            </div>


            <div class="event-list">

                <a
                        class="event-card"
                        th:each="concert : ${concerts}"
                        th:href="${concert.ticketUrl()}"
                        target="_blank"
                        rel="noopener noreferrer"
                >

                    <div class="event-date">

                        <span
                                th:if="${concert.date != null}"
                                th:text="${concert.date}"
                        >
                            01 Jan 2027
                        </span>

                        <span th:if="${concert.date == null}">
                            Date TBA
                        </span>

                    </div>


                    <div class="event-information">

                        <h3 th:text="${concert.name}">
                            Event name
                        </h3>

                        <p th:if="${concert.venue != null}">

                            <span th:text="${concert.venue}">
                                Venue
                            </span>

                            <span th:if="${concert.city != null}">
                                ,
                                <span th:text="${concert.city}">
                                    City
                                </span>
                            </span>

                        </p>

                    </div>


                    <span class="ticket-link">
                        View tickets
                    </span>

                </a>

            </div>


            <div
                    class="empty-message"
                    th:if="${#lists.isEmpty(concerts)}"
            >

                <p>
                    No upcoming events found for this artist.
                </p>

            </div>

        </section>

    </main>


    <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>


<script>

    function scrollToEvents() {

        document
            .getElementById("upcoming-events")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    }


    function scrollAlbums(direction) {

        const carousel =
            document.getElementById("albumCarousel");

        const scrollAmount = 300;

        carousel.scrollBy({
            left: direction * scrollAmount,
            behavior: "smooth"
        });

    }


    const carousel =
        document.getElementById("albumCarousel");


    let autoScroll;


    function startAutoScroll() {

        autoScroll = setInterval(() => {

            if (
                carousel.scrollLeft +
                carousel.clientWidth >=
                carousel.scrollWidth - 10
            ) {

                carousel.scrollTo({
                    left: 0,
                    behavior: "smooth"
                });

            } else {

                carousel.scrollBy({
                    left: 260,
                    behavior: "smooth"
                });

            }

        }, 3500);

    }


    function stopAutoScroll() {

        clearInterval(autoScroll);

    }


    carousel.addEventListener(
        "mouseenter",
        stopAutoScroll
    );

    carousel.addEventListener(
        "mouseleave",
        startAutoScroll
    );

    carousel.addEventListener(
        "touchstart",
        stopAutoScroll
    );


    startAutoScroll();

</script>


</body>

</html>
