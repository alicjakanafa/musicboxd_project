<!-- templates/fragments/navbar.html -->

<header class="site-header" th:fragment="navbar">

    <nav class="nav-left">

        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/reviews}">Reviews</a>
        <a th:href="@{/lists}">Lists</a>
        <a th:href="@{/friends}">Friends</a>

        <form
                class="album-search"
                th:action="@{/search}"
                method="get"
        >
            <input
                    type="search"
                    name="query"
                    placeholder="Search albums..."
                    aria-label="Search albums"
            >

            <button type="submit" aria-label="Search">
                🔍
            </button>
        </form>

    </nav>

    <a
            class="brand"
            th:href="@{/}"
            aria-label="MusicBoxd home"
    >
        <span class="brand-name">MUSICBOXD</span>
        <span class="brand-tagline">
            it’s letterboxd, but music
        </span>
    </a>

    <nav class="nav-right">

        <!-- Logged in -->
        <div
                class="logged-in"
                th:if="${#authorization.expression('isAuthenticated()')}"
        >
    <span class="welcome-message">
        Welcome,
        <span
                th:if="${currentUser != null}"
                th:text="${currentUser.username}"
        >
            User
        </span>
    </span>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">
                    Log out
                </button>
            </form>
        </div>
        <!-- Logged out -->
        <div
                class="logged-out"
                th:if="${#authorization.expression('!isAuthenticated()')}"
        >
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Register</a>
        </div>

    </nav>

</header>
