<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${list.title}">List</title>
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>

<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>
<main>


  <h1 th:text="${list.title}">
    List title
  </h1>

  <p th:text="${list.description}">
    List description
  </p>



  <h2>In this list</h2>

  <div th:if="${items == null or items.isEmpty()}">
    <p>Nothing added yet.</p>
  </div>

  <ul>

    <li th:each="item : ${items}"
        th:if="${item.albumId != null and albums[item.albumId] != null}">

      <h3>
        <a th:href="@{/lists/album/{id}(id=${albums[item.albumId].id})}"
           th:text="${albums[item.albumId].title}">
          Album title
        </a>
      </h3>

      <img
              th:if="${albums[item.albumId].artworkUrl != null}"
              th:src="${albums[item.albumId].artworkUrl}"
              th:alt="${albums[item.albumId].title}"
              width="150"
      >

      <p th:text="${albums[item.albumId].releaseYear}">
        Release year
      </p>

    </li>

  </ul>



  <h3>Add an album</h3>

  <input
          type="text"
          id="albumSearch"
          placeholder="Search for an album..."
  >

  <div id="searchResults"></div>



  <p>
    <a th:href="@{/lists}">
      Back to lists
    </a>
  </p>

</main>



<div th:fragment="searchResults">

  <ul>

    <li th:each="album : ${results}">

            <span th:text="${album.name}">
                Album
            </span>

      <span> — </span>

      <span th:text="${album.artist}">
                Artist
            </span>

      <form
              th:action="@{/lists/{id}/albums(id=${listId})}"
              method="post"
              style="display:inline"
      >

        <input
                type="hidden"
                name="title"
                th:value="${album.name}"
        >

        <input
                type="hidden"
                name="artist"
                th:value="${album.artist}"
        >

        <button type="submit">
          Add
        </button>

      </form>

    </li>

    <p th:if="${results == null or results.isEmpty()}">
      No results.
    </p>

  </ul>

</div>


<script th:inline="javascript">

  const listId = /*[[${list.id}]]*/ 0;

  const input = document.getElementById('albumSearch');
  const resultsBox = document.getElementById('searchResults');

  let debounceTimer;

  input.addEventListener('input', () => {

    clearTimeout(debounceTimer);

    const term = input.value.trim();

    if (term.length < 2) {
      resultsBox.innerHTML = '';
      return;
    }

    debounceTimer = setTimeout(() => {

      fetch(
              `/lists/${listId}/search?query=${encodeURIComponent(term)}`
      )
              .then(res => res.text())
              .then(html => {
                resultsBox.innerHTML = html;
              });

    }, 300);

  });

</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>


</body>

</html>
