<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>MusicBoxd - Search Albums</title>


    <!-- Google Fonts -->

    <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
    >

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
    >

    <link
            href="https://fonts.googleapis.com/css2?family=Audiowide&family=DM+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
    >


    <!-- CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/search.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/navbar.css}"
    >

    <link
            rel="stylesheet"
            th:href="@{/css/footer.css}"
    >

</head>


<body>

<div class="page">


    <!-- NAVBAR -->

    <header
            th:replace="~{fragments/navbar :: navbar}"
    >
    </header>


    <!-- MAIN CONTENT -->

    <main class="container">


        <!-- HERO -->

        <section class="hero">

            <div class="hero-label">
                MUSICBOXD SEARCH
            </div>

            <h1>
                Find <span>Albums</span>
            </h1>

            <p>
                Search for albums and discover what you want to listen to and review.
            </p>

        </section>


        <!-- SEARCH FORM -->

        <form
                action="/search"
                method="get"
                class="search-form"
        >

            <input
                    type="text"
                    name="query"
                    th:value="${query}"
                    placeholder="Search for an album or artist..."
                    required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <!-- RESULTS HEADER -->

        <section
                class="results-header"
                th:if="${albums != null and !albums.isEmpty()}"
        >

            <div>

                <h2>
                    Search Results
                </h2>

                <p>
                    Albums matching your search
                </p>

            </div>

        </section>


        <!-- RESULTS -->

        <div
                class="results"
                th:if="${albums != null and !albums.isEmpty()}"
        >


            <!-- ALBUM CARD -->

            <div
                    class="album-card"
                    th:each="album : ${albums}"
            >


                <!-- ALBUM ARTWORK -->

                <img
                        th:if="${album.image != null and !album.image.isEmpty()}"
                        th:src="${album.image.get(album.image.size() - 1).text}"
                        th:alt="${album.name}"
                        onerror="this.onerror=null; this.src='/images/image-unavailable.svg';"
                >

                <img
                        th:if="${album.image == null or album.image.isEmpty()}"
                        src="/images/image-unavailable.svg"
                        th:alt="${album.name}"
                >


                <!-- ALBUM NAME -->

                <h2
                        th:text="${album.name}"
                >
                    Album Name
                </h2>


                <!-- ARTIST -->

                <p
                        th:text="${album.artist}"
                >
                    Artist Name
                </p>


                <!-- VIEW ALBUM -->

                <a
                        th:href="@{/album/from-artist(
                            artistName=${album.artist},
                            albumName=${album.name}
                        )}"
                        class="view-album-button"
                >
                    View Album
                    <span>→</span>
                </a>

            </div>

        </div>


        <!-- NO RESULTS -->

        <div
                class="empty-state"
                th:if="${albums != null and albums.isEmpty()}"
        >

            <div class="empty-icon">
                ♪
            </div>

            <h2>
                No albums found
            </h2>

            <p>
                Try searching for a different artist or album.
            </p>

        </div>


    </main>


    <!-- FOOTER -->

    <footer
            th:replace="~{fragments/footer :: footer}"
    >
    </footer>


</div>

</body>

</html>
