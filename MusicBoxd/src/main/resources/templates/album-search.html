<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Search Albums - MusicBoxd</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin: 30px auto;
            max-width: 700px;
        }

        .search-form input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        .search-form button {
            padding: 12px 25px;
            cursor: pointer;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .album-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .album-card img {
            width: 100%;
            border-radius: 8px;
        }

        .album-card h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .album-card p {
            color: #666;
            margin-top: 5px;
        }

        .album-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Search Albums</h1>

    <form action="/search" method="get" class="search-form">

        <input
                type="text"
                name="query"
                th:value="${query}"
                placeholder="Search for an album or artist..."
                required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <div class="results">

        <div
                class="album-card"
                th:each="album : ${albums}"
        >

            <img
                    th:if="${album.artworkUrl100 != null}"
                    th:src="${album.artworkUrl100}"
                    th:alt="${album.collectionName}"
            >

            <h2 th:text="${album.collectionName}">
                Album Name
            </h2>

            <p th:text="${album.artistName}">
                Artist Name
            </p>

            <a
                    th:href="@{/album/{id}(id=${album.collectionId})}"
            >
                View Album
            </a>

        </div>

    </div>

</div>

</body>
</html>
