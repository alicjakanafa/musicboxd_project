<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MusicBoxd - Search Albums</title>

    <link rel="stylesheet" th:href="@{/css/search.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<div class="page">

    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="container">

        <section class="hero">

            <div class="hero-label">
                MUSICBOXD SEARCH
            </div>

            <h1>
                Find <span>Albums</span>
            </h1>

            <p>
                Search for albums and discover what you want to listen to and review.
            </p>

        </section>


        <form
                action="/search"
                method="get"
                class="search-form"
        >

            <input
                    type="text"
                    name="query"
                    th:value="${query}"
                    placeholder="Search for an album or artist..."
                    required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <section
                class="results-header"
                th:if="${albums != null and !albums.isEmpty()}"
        >

            <div>

                <h2>
                    Search Results
                </h2>

                <p>
                    Albums matching your search
                </p>

            </div>

        </section>


        <div
                class="results"
                th:if="${albums != null and !albums.isEmpty()}"
        >

            <div
                    class="album-card"
                    th:each="album : ${albums}"
            >

                <!-- Last.fm artwork -->

                <img
                        th:if="${album.image != null and !album.image.isEmpty()}"
                        th:src="${album.image.get(album.image.size() - 1).text}"
                        th:alt="${album.name}"
                >


                <h2 th:text="${album.name}">
                    Album Name
                </h2>


                <p th:text="${album.artist}">
                    Artist Name
                </p>


                <a
                        th:href="@{/album/from-artist(
                            artistName=${album.artist},
                            albumName=${album.name}
                        )}"
                >
                    View Album
                    <span>→</span>
                </a>

            </div>

        </div>


        <div
                class="empty-state"
                th:if="${albums != null and albums.isEmpty()}"
        >

            <div class="empty-icon">
                ♪
            </div>

            <h2>
                No albums found
            </h2>

            <p>
                Try searching for a different artist or album.
            </p>

        </div>

    </main>


    <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>

</body>

</html>
