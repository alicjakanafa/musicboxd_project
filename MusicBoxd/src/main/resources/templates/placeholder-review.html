<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Album - MusicBoxd</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F5F5F5;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        .album-info {
            text-align: center;
            margin-bottom: 30px;
        }
        .album-info img {
            width: 250px;
            border-radius: 10px;
        }
        .album-info h1 {
            margin-bottom: 5px;
        }
        .album-info p {
            color: #666;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            min-height: 180px;
            resize: vertical;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="album-info">
    </div>
    <form action="/search" method="get" >
        <input
                type="text"
                name="query"
                th:value="${query}"
                placeholder="Search for an album or artist..."
                required
        >
        <button type="submit">
            Search
        </button>
        <label for="rating">
            Rating
        </label>
        <select
                id="rating"
                name="rating"
        >
            <option value="">Choose a rating</option>
            <option value="1">1 / 5</option>
            <option value="2">2 / 5</option>
            <option value="3">3 / 5</option>
            <option value="4">4 / 5</option>
            <option value="5">5 / 5</option>
        </select>
        <label for="content">
            Your Review
        </label>
        <textarea
                id="content"
                name="content"
                placeholder="Write your review..."
        ></textarea>
        <button type="submit">
            Submit Review
        </button>
    </form>
</div>
</body>
</html>
