<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title th:text="${album.title} + ' - Review'">
        Album Review
    </title>

    <link rel="stylesheet" th:href="@{/css/review.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<div class="album-page">

    <h1>
        New Review
    </h1>


    <!-- =====================================================
         ALBUM INFORMATION
         ===================================================== -->

    <section class="album-header">

        <div class="album-art">

            <!-- =================================================
                 FIRST: USE STORED ALBUM ARTWORK
                 ================================================= -->

            <img
                    th:if="${album.artworkUrl != null
                    and !album.artworkUrl.isEmpty()}"
                    th:src="${album.artworkUrl}"
                    th:alt="${album.title}"
            >


            <!-- =================================================
                 SECOND: FALL BACK TO LAST.FM ARTWORK
                 ================================================= -->

            <img
                    th:if="${(album.artworkUrl == null
                    or album.artworkUrl.isEmpty())
                    and lastFmAlbum != null
                    and lastFmAlbum.image != null
                    and !lastFmAlbum.image.isEmpty()
                    and lastFmAlbum.image.get(lastFmAlbum.image.size() - 1) != null
                    and lastFmAlbum.image.get(lastFmAlbum.image.size() - 1).text != null
                    and !lastFmAlbum.image.get(lastFmAlbum.image.size() - 1).text.isEmpty()}"
                    th:src="${lastFmAlbum.image.get(lastFmAlbum.image.size() - 1).text}"
                    th:alt="${album.title}"
            >


            <!-- =================================================
                 NO ARTWORK
                 ================================================= -->

            <div
                    class="album-art-placeholder"
                    th:if="${(album.artworkUrl == null
                    or album.artworkUrl.isEmpty())
                    and (lastFmAlbum == null
                    or lastFmAlbum.image == null
                    or lastFmAlbum.image.isEmpty()
                    or lastFmAlbum.image.get(lastFmAlbum.image.size() - 1) == null
                    or lastFmAlbum.image.get(lastFmAlbum.image.size() - 1).text == null
                    or lastFmAlbum.image.get(lastFmAlbum.image.size() - 1).text.isEmpty())}"
            >
                No artwork
            </div>

        </div>


        <!-- =====================================================
             ALBUM DETAILS
             ===================================================== -->

        <div class="album-information">

            <p>
                ALBUM
            </p>

            <h1 th:text="${album.title}">
                Album Title
            </h1>


            <p th:if="${artist != null}">

                <a
                        th:href="@{/artists/{id}(id=${artist.id})}"
                        th:text="${artist.name}"
                >
                    Artist Name
                </a>

            </p>


            <p
                    th:if="${album.releaseYear != null}"
                    th:text="${album.releaseYear}"
            >
                Release Year
            </p>

        </div>

    </section>


    <!-- =====================================================
         REVIEW FORM
         ===================================================== -->

    <form
            class="review-form"
            th:action="@{/reviews/{id}(id=${album.id})}"
            method="post"
    >

        <h2>
            Rating
        </h2>


        <div class="rating">

            <input
                    type="radio"
                    id="rating5"
                    name="rating"
                    value="5"
            >

            <label for="rating5">★</label>


            <input
                    type="radio"
                    id="rating4"
                    name="rating"
                    value="4"
            >

            <label for="rating4">★</label>


            <input
                    type="radio"
                    id="rating3"
                    name="rating"
                    value="3"
            >

            <label for="rating3">★</label>


            <input
                    type="radio"
                    id="rating2"
                    name="rating"
                    value="2"
            >

            <label for="rating2">★</label>


            <input
                    type="radio"
                    id="rating1"
                    name="rating"
                    value="1"
            >

            <label for="rating1">★</label>

        </div>


        <h2>
            What are your thoughts?
        </h2>


        <textarea
                id="content"
                name="content"
                placeholder="Write your review..."
                required
        ></textarea>


        <button
                type="submit"
                class="review-button"
        >
            Post Review
        </button>

    </form>

</div>


<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>

</html>
